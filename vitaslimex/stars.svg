<svg width="320" height="64" viewBox="0 0 320 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="5 out of 5 stars">
  <defs>
    <!-- Premium metallic gold -->
    <linearGradient id="goldBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="18%" stop-color="#F7D45A"/>
      <stop offset="38%" stop-color="#E0A11A"/>
      <stop offset="55%" stop-color="#FFD86A"/>
      <stop offset="72%" stop-color="#C98200"/>
      <stop offset="88%" stop-color="#B87400"/>
      <stop offset="100%" stop-color="#F2C94C"/>
    </linearGradient>

    <!-- Top metallic shine -->
    <linearGradient id="goldShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="28%" stop-color="#FFF8D6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFF3BC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Deeper lower gold -->
    <linearGradient id="goldShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8A5600" stop-opacity="0.20"/>
    </linearGradient>

    <g id="premiumStar">
      <!-- star base -->
      <polygon
        points="30,3 36.47,21.10 55.68,21.66 40.46,33.40 45.87,51.84 30,41 14.13,51.84 19.54,33.40 4.32,21.66 23.53,21.10"
        fill="url(#goldBase)"
      />

      <!-- glossy top overlay -->
      <polygon
        points="30,3 36.47,21.10 55.68,21.66 40.46,33.40 45.87,51.84 30,41 14.13,51.84 19.54,33.40 4.32,21.66 23.53,21.10"
        fill="url(#goldShine)"
      />

      <!-- subtle bottom depth -->
      <polygon
        points="30,3 36.47,21.10 55.68,21.66 40.46,33.40 45.87,51.84 30,41 14.13,51.84 19.54,33.40 4.32,21.66 23.53,21.10"
        fill="url(#goldShadow)"
      />

      <!-- faceted metallic sections -->
      <polygon points="30,3 30,28 23.53,21.10" fill="#FCE08A" opacity="0.95"/>
      <polygon points="30,3 36.47,21.10 30,28" fill="#E7B22D" opacity="0.95"/>
      <polygon points="4.32,21.66 23.53,21.10 30,28" fill="#F1C63C" opacity="0.95"/>
      <polygon points="36.47,21.10 55.68,21.66 30,28" fill="#FFD95F" opacity="0.95"/>
      <polygon points="4.32,21.66 30,28 19.54,33.40" fill="#D89510" opacity="0.95"/>
      <polygon points="55.68,21.66 40.46,33.40 30,28" fill="#C47F00" opacity="0.95"/>
      <polygon points="19.54,33.40 30,28 14.13,51.84" fill="#C88400" opacity="0.95"/>
      <polygon points="30,28 30,41 14.13,51.84" fill="#A66A00" opacity="0.95"/>
      <polygon points="30,28 45.87,51.84 30,41" fill="#E3AA1B" opacity="0.95"/>
      <polygon points="30,28 40.46,33.40 45.87,51.84" fill="#B87400" opacity="0.95"/>

      <!-- center highlight -->
      <polygon points="30,11 33.8,21.5 30,28 26.2,21.5" fill="#FFF5C8" opacity="0.65"/>
    </g>
  </defs>

  <use href="#premiumStar" x="0"/>
  <use href="#premiumStar" x="64"/>
  <use href="#premiumStar" x="128"/>
  <use href="#premiumStar" x="192"/>
  <use href="#premiumStar" x="256"/>
</svg>