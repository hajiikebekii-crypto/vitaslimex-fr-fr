<svg width="180" height="200" viewBox="0 0 180 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Outer frame gold -->
    <linearGradient id="frameGold" x1="15" y1="20" x2="165" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1A0"/>
      <stop offset="18%" stop-color="#FFD350"/>
      <stop offset="38%" stop-color="#E8A000"/>
      <stop offset="58%" stop-color="#FFDC63"/>
      <stop offset="78%" stop-color="#C87800"/>
      <stop offset="100%" stop-color="#F8BB18"/>
    </linearGradient>

    <!-- Main shield metallic gold -->
    <linearGradient id="shieldGold" x1="25" y1="90" x2="155" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B96B00"/>
      <stop offset="12%" stop-color="#EBAA13"/>
      <stop offset="28%" stop-color="#FFF0A4"/>
      <stop offset="40%" stop-color="#FFD65A"/>
      <stop offset="53%" stop-color="#FFF1A2"/>
      <stop offset="67%" stop-color="#C87500"/>
      <stop offset="82%" stop-color="#E89A00"/>
      <stop offset="100%" stop-color="#FFDF68"/>
    </linearGradient>

    <!-- Inner dark gold edge -->
    <linearGradient id="innerEdge" x1="30" y1="20" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A4700"/>
      <stop offset="50%" stop-color="#C77700"/>
      <stop offset="100%" stop-color="#6D3500"/>
    </linearGradient>

    <!-- Rivet -->
    <radialGradient id="rivetGold" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFF8C7"/>
      <stop offset="22%" stop-color="#FFD34C"/>
      <stop offset="52%" stop-color="#C97700"/>
      <stop offset="82%" stop-color="#7A3B00"/>
      <stop offset="100%" stop-color="#E5A414"/>
    </radialGradient>

    <!-- Center glossy shine -->
    <linearGradient id="shine" x1="45" y1="40" x2="110" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#FFF6BE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C4700" flood-opacity="0.35"/>
    </filter>

  </defs>


  <!-- OUTER SHIELD -->
  <path
    d="
      M16 28
      C42 29 61 23 76 13
      L104 13
      C119 23 138 29 164 28

      L161 83
      C159 125 137 158 90 187
      C43 158 21 125 19 83
      Z
    "
    fill="url(#frameGold)"
    filter="url(#shadow)"
  />


  <!-- DARK INNER FRAME -->
  <path
    d="
      M25 38
      C47 38 64 32 78 22
      L102 22
      C116 32 133 38 155 38

      L152 82
      C150 119 131 148 90 174
      C49 148 30 119 28 82
      Z
    "
    fill="url(#innerEdge)"
  />


  <!-- MAIN GOLD FACE -->
  <path
    d="
      M29 42
      C49 42 66 36 80 27
      L100 27
      C114 36 131 42 151 42

      L148 81
      C146 115 129 143 90 168
      C51 143 34 115 32 81
      Z
    "
    fill="url(#shieldGold)"
  />


  <!-- LEFT GLOSSY LIGHT -->
  <path
    d="
      M32 47
      C48 45 63 40 78 31
      C62 57 54 87 58 115
      C61 135 69 151 87 164
      C53 141 37 113 35 81
      Z
    "
    fill="url(#shine)"
    opacity="0.78"
  />


  <!-- CENTER GOLD STRIP -->
  <path
    d="
      M86 27
      L95 27
      L95 164
      C93 166 92 167 90 168
      C88 167 87 166 86 165
      Z
    "
    fill="#FFE783"
    opacity="0.28"
  />


  <!-- RIVETS -->

  <!-- top -->
  <circle cx="90" cy="19" r="4.6" fill="url(#rivetGold)"/>

  <circle cx="57" cy="25" r="4" fill="url(#rivetGold)"/>
  <circle cx="123" cy="25" r="4" fill="url(#rivetGold)"/>

  <circle cx="29" cy="34" r="3.8" fill="url(#rivetGold)"/>
  <circle cx="151" cy="34" r="3.8" fill="url(#rivetGold)"/>

  <!-- sides -->
  <circle cx="24" cy="70" r="4" fill="url(#rivetGold)"/>
  <circle cx="156" cy="70" r="4" fill="url(#rivetGold)"/>

  <circle cx="27" cy="104" r="4" fill="url(#rivetGold)"/>
  <circle cx="153" cy="104" r="4" fill="url(#rivetGold)"/>

  <!-- lower -->
  <circle cx="43" cy="139" r="4" fill="url(#rivetGold)"/>
  <circle cx="137" cy="139" r="4" fill="url(#rivetGold)"/>

  <circle cx="66" cy="165" r="4" fill="url(#rivetGold)"/>
  <circle cx="114" cy="165" r="4" fill="url(#rivetGold)"/>

  <circle cx="90" cy="178" r="4.5" fill="url(#rivetGold)"/>


  <!-- RIVET HIGHLIGHTS -->
  <g fill="#FFF7C2" opacity="0.9">
    <circle cx="88.5" cy="17.5" r="1.2"/>
    <circle cx="55.8" cy="23.8" r="1"/>
    <circle cx="121.8" cy="23.8" r="1"/>
    <circle cx="27.8" cy="32.8" r="1"/>
    <circle cx="149.8" cy="32.8" r="1"/>
    <circle cx="22.8" cy="68.8" r="1"/>
    <circle cx="154.8" cy="68.8" r="1"/>
    <circle cx="25.8" cy="102.8" r="1"/>
    <circle cx="151.8" cy="102.8" r="1"/>
    <circle cx="41.8" cy="137.8" r="1"/>
    <circle cx="135.8" cy="137.8" r="1"/>
    <circle cx="64.8" cy="163.8" r="1"/>
    <circle cx="112.8" cy="163.8" r="1"/>
    <circle cx="88.5" cy="176.5" r="1.2"/>
  </g>

</svg>